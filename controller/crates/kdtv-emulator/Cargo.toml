[package]
name = "kdtv-emulator"
description = "Device models, the byte-level wire simulator, simulated HAL and the end-to-end rig. Never a dependency of the daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Only what is actually used. The workspace crates get added back as the device
# models, the simulated HAL and the end-to-end rig land; declaring them early
# couples this crate's build to crates it does not yet call.
[dependencies]
kdtv-units = { workspace = true }
nix = { workspace = true, features = ["fs", "term", "poll"] }
thiserror = { workspace = true }

[lints]
workspace = true
