[package]
name = "kdtvd"
description = "The replacement master daemon for the Kohler DTV+"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kdtvd"
path = "src/main.rs"

# kdtv-api and kdtv-service are added when the run path needs them. Until then
# this binary is the validator deploy.sh runs on the target, and declaring
# crates it does not call would couple its build to theirs.
[dependencies]
kdtv-config = { workspace = true }
kdtv-hal = { workspace = true }
kdtv-proto = { workspace = true }
kdtv-telemetry = { workspace = true }
kdtv-units = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
