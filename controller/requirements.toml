area = "physical"
statement = "Drive the Saturn bus as RS485 half-duplex at 9600 baud, 8 data bits, no parity, 1 stop bit, no hardware flow control."
source = "research/xagon0/docs/protocols/saturn-protocol.md — Physical Layer"
tier = "C"
verification = "manual commissioning (scope/analyser); unit-testable only as a UART config assertion"
hard = false

[[requirement]]
id = "PHY-02"
document = "research/xagon0/docs/protocols/saturn-protocol.md"
area = "physical"
statement = "Reject or refuse to emit any Saturn frame whose total on-wire length exceeds 20 bytes, i.e. DATA_LEN must be <= 14."
source = "research/xagon0/docs/protocols/saturn-protocol.md — Physical Layer (Max Packet Size) + Response Validation step 3"
tier = "C"
verification = "unit + property (fuzz DATA_LEN 0..255, assert encode/decode reject > 14)"
hard = false

[[requirement]]
id = "PHY-03"
document = "research/xagon0/docs/protocols/saturn-protocol.md"
area = "physical"
statement = "Assert DE before transmitting, de-assert DE after the last byte, assert RE to listen, discard the transmitted echo bytes, then parse the response."
source = "research/xagon0/docs/protocols/saturn-protocol.md — Half-Duplex Bus Management"
tier = "C"
verification = "emulator e2e with a loopback echo model"
hard = false

[[requirement]]
id = "FRAME-01"
document = "research/xagon0/docs/protocols/saturn-protocol.md"
area = "framing"
statement = "Emit and require the fixed 2-byte preamble SYNC1=0xAA at offset 0 and SYNC2=0x55 at offset 1 on every frame in both directions."
source = "research/xagon0/docs/protocols/saturn-protocol.md — Frame Format / Field Definitions"
tier = "C"
verification = "unit"
hard = false

[[requirement]]
id = "FRAME-02"
document = "research/xagon0/docs/protocols/saturn-protocol.md"
area = "framing"
statement = "Lay out every frame as SYNC1(0) SYNC2(1) ADDRESS(2) CONTROL(3) DATA_LEN(4) DATA(5 .. 4+DATA_LEN) CHECKSUM(5+DATA_LEN), giving total length = 6 + DATA_LEN."
source = "research/xagon0/docs/protocols/saturn-protocol.md — Field Definitions / Overhead Calculation"
tier = "C"
verification = "unit + property (round-trip encode/decode for DATA_LEN 0..14)"
hard = false

[[requirement]]
id = "FRAME-03"
document = "research/xagon0/docs/protocols/saturn-protocol.md"
area = "framing"
statement = "Treat ADDRESS as the destination of the frame, not the sender: both captured device-to-master responses carry ADDRESS=0x00 (the master), so a response's ADDRESS must be validated against the master address in use, not against the valve address that was queried."
source = "research/xagon0/docs/protocols/saturn-protocol.md — Annotated Packet Captures Examples 1 and 3, vs Response Validation step 2"
tier = "C"
verification = "unit (decode the two captured responses); emulator e2e"
hard = false

[[requirement]]
id = "FRAME-04"
document = "research/xagon0/docs/protocols/saturn-protocol.md"
area = "framing"
statement = "Resynchronise the receiver by scanning for the 0xAA 0x55 pair before attempting to parse a frame; discard any leading bytes that are not that pair (required to survive TX-echo bleed on the half-duplex bus)."
source = "research/xagon0/docs/protocols/saturn-protocol.md — Response Validation step 1 + Half-Duplex Bus Management step 4"
tier = "C"
verification = "property (prepend random garbage to a valid frame, assert it still decodes)"
hard = false

[[requirement]]
id = "FRAME-05"
document = "research/xagon0/docs/protocols/saturn-protocol.md"
area = "framing"
statement = "Validate a received frame in this order — sync pair, ADDRESS matches expected, DATA_LEN within the 20-byte packet bound, checksum, then CONTROL for error indicators — and process no DATA field before the checksum has passed."
source = "research/xagon0/docs/protocols/saturn-protocol.md — Implementation Notes / Response Validation"
tier = "C"
verification = "unit (corrupt each field in turn, assert rejection at the right stage)"
hard = false

[[requirement]]
id = "CHK-01"
document = "research/xagon0/docs/protocols/saturn-protocol.md"
area = "checksum"
statement = "Compute the checksum as the 8-bit two's complement of the sum of ADDRESS + CONTROL + DATA_LEN + every DATA byte: total = sum & 0xFF; checksum = (~total + 1) & 0xFF."
source = "research/xagon0/docs/protocols/saturn-protocol.md — Checksum Calculation / Algorithm"
tier = "C"
verification = "unit against the fixed vector set + property (sum of all covered bytes plus checksum is 0 mod 256)"
hard = false

[[requirement]]
id = "CHK-02"
document = "research/xagon0/docs/protocols/saturn-protocol.md"
area = "checksum"
statement = "Exclude SYNC1 and SYNC2 from the checksum sum — this is confirmed arithmetically by the captured response AA 55 00 02 01 1E DF, whose stated checksum 0xDF only holds when the sync bytes are omitted (including them yields 0xE0)."
source = "research/xagon0/docs/protocols/saturn-protocol.md — Checksum Calculation + Example 1 response"
tier = "C"
verification = "unit (assert the captured response validates and that a sync-inclusive variant does not)"
hard = false

[[requirement]]
id = "CHK-03"
document = "research/xagon0/docs/protocols/saturn-protocol.md"
area = "checksum"
statement = "Verify received frames by summing ADDRESS + CONTROL + DATA_LEN + DATA + CHECKSUM and requiring the low 8 bits to equal 0x00."
source = "research/xagon0/docs/protocols/saturn-protocol.md — Checksum Calculation / Verification"
tier = "C"
verification = "unit + property (any single-byte mutation of a valid frame must fail unless it is a compensating pair)"
hard = false

[[requirement]]
id = "CHK-04"
document = "research/xagon0/docs/protocols/saturn-protocol.md"
area = "checksum"
statement = "Do not port the literal byte strings printed on the first TX line of Example 1 (0xA1) or Example 3 (0xAE): both are stale pre-correction values; use the document's own corrected checksums 0xFB and 0xB3, which recomputation confirms."
source = "research/xagon0/docs/protocols/saturn-protocol.md — Annotated Packet Captures Examples 1 and 3"
tier = "C"
verification = "unit (the codec must produce 0xFB and 0xB3 for those field sets)"
hard = false

