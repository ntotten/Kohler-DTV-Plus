source = "research/xagon0/docs/protocols/dtv-plus-protocol.md § Byte Stuffing Rules, § Escape Processing (TX path)"
tier = "C"
verification = "unit (encode vectors 88 03 00 34 1F AA AA 55, 88 03 00 34 41 AA 88 55, 88 03 00 34 74 AA 55 55)"
hard = false

[[requirement]]
id = "FRAME-04"
document = "research/xagon0/docs/protocols/dtv-plus-protocol.md"
area = "framing"
statement = "On receive, when 0xAA is seen inside a frame, consume the following byte as a literal data byte and never interpret it as SOF or EOF."
source = "research/xagon0/docs/protocols/dtv-plus-protocol.md § Byte Stuffing Rules (Decoding), § Escape Processing (RX path)"
tier = "C"
verification = "unit (decode vector 88 03 00 34 74 AA 55 55 must yield payload byte 0x74 with checksum 0x55, terminated by the second 0x55)"
hard = false

[[requirement]]
id = "FRAME-05"
document = "research/xagon0/docs/protocols/dtv-plus-protocol.md"
area = "framing"
statement = "Treat an unescaped 0x55 as end-of-frame and an unescaped 0x88 as a resynchronisation point that discards any partial frame in progress."
source = "research/xagon0/docs/protocols/dtv-plus-protocol.md § Frame Format, § Escape Processing"
tier = "C"
verification = "unit (feed a truncated frame followed by a valid one, assert the valid one is recovered)"
hard = false

[[requirement]]
id = "FRAME-06"
document = "research/xagon0/docs/protocols/dtv-plus-protocol.md"
area = "framing"
statement = "Carry no length field on the wire and derive frame length from the SOF/EOF delimiters only; a decoder must therefore bound the frame it is accumulating and abort on overrun rather than growing without limit."
source = "research/xagon0/docs/protocols/dtv-plus-protocol.md § Frame Format (no length field present); § Physical Layer (2048-byte buffers)"
tier = "C"
verification = "property (arbitrary byte streams must never allocate beyond the buffer bound)"
hard = false

[[requirement]]
id = "FRAME-07"
document = "research/xagon0/docs/protocols/dtv-plus-protocol.md"
area = "framing"
statement = "Handle 0xAA followed by a byte that is not 0x88, 0x55 or 0xAA by taking the following byte literally, and record the occurrence as a protocol anomaly because no source specifies this case."
source = "research/xagon0/docs/protocols/dtv-plus-protocol.md § Byte Stuffing Rules (Decoding) — rule is stated unconditionally; the illegal-escape case is unspecified"
tier = "?"
verification = "unit (decoder must not panic; anomaly counter increments)"
hard = false

[[requirement]]
id = "FRAME-08"
document = "research/xagon0/docs/protocols/dtv-plus-protocol.md"
area = "framing"
statement = "Reject as malformed any frame whose escape sequence is truncated by EOF (a trailing 0xAA immediately before the unescaped 0x55)."
source = "research/xagon0/docs/protocols/dtv-plus-protocol.md § Byte Stuffing Rules"
tier = "I"
verification = "unit"
hard = false

[[requirement]]
id = "FRAME-09"
document = "research/xagon0/docs/protocols/dtv-plus-protocol.md"
area = "framing"
statement = "Compute the checksum over the unescaped (logical) byte sequence and apply byte stuffing only afterwards, as the last step before transmission."
source = "research/xagon0/docs/protocols/dtv-plus-protocol.md § Annotated Packet Captures, Example 2 (\"Checksum calc (on unescaped data)\")"
tier = "C"
verification = "unit (encode a frame whose payload is 0x55 and assert checksum 0x73, not a value computed over 0xAA 0x55)"
hard = false

[[requirement]]
id = "CKSUM-01"
document = "research/xagon0/docs/protocols/dtv-plus-protocol.md"
area = "checksum"
statement = "Compute the checksum as ((~((DEST + SRC + CMD + sum(payload)) & 0xFF)) + 1) & 0xFF — the 8-bit two's complement of the running sum, excluding SOF and EOF."
source = "research/xagon0/docs/protocols/dtv-plus-protocol.md § Checksum Calculation"
tier = "C"
verification = "unit (golden vectors: 03 00 30 01 -> 0xCC; 03 00 30 -> 0xCD; 05 00 30 -> 0xCB; FF 00 05 -> 0xFC; 00 00 06 05 -> 0xF5; 00 00 07 03 -> 0xF6; 03 00 34 01 55 -> 0x73)"
hard = false

[[requirement]]
id = "CKSUM-02"
document = "research/xagon0/docs/protocols/dtv-plus-protocol.md"
area = "checksum"
statement = "Validate a received frame by summing DEST through CHECKSUM inclusive of the unescaped bytes and requiring the result masked to 8 bits to equal 0x00."
source = "research/xagon0/docs/protocols/dtv-plus-protocol.md § Verification, § Checksum Verification"
tier = "C"
verification = "unit plus property (encode-then-verify round trip over arbitrary frames)"
hard = false

[[requirement]]
id = "CKSUM-03"
document = "research/xagon0/docs/protocols/dtv-plus-protocol.md"
area = "checksum"
statement = "Discard any frame that fails checksum verification without acting on its contents, count it as a receive failure, and never partially apply a decoded field from a bad frame."
source = "research/xagon0/docs/protocols/dtv-plus-protocol.md § Checksum Verification"
tier = "C"
verification = "unit (corrupt one byte of a status frame and assert no state change)"
hard = true

