document = "docs/replacement-controller/HARDWARE-SPEC.md"
area = "USB / serial startup"
statement = "If a converter arrives with a non-FTDI bridge, establish that driver's equivalent low-latency setting and adjust the start-up read-back before the unit is used; do not ship a unit whose low-latency setting is unverified."
