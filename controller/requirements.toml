[[requirement]]
id = "USB-02"
document = "docs/replacement-controller/HARDWARE-SPEC.md"
area = "USB / serial startup"
statement = "Bind each zone to its converter by physical USB port path, never by /dev/ttyUSB* enumeration order, because duplicate or blank USB serial numbers are an expected failure mode."
source = "docs/replacement-controller/HARDWARE-SPEC.md §5 'The three USB failure modes and their mitigations'"
verification = "unit (device-path resolver against fixture sysfs trees) plus manual commissioning"
hard = true

[[requirement]]
