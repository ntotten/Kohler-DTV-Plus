[[requirement]]
id = "STEAM-16"
document = "docs/replacement-controller/HARDWARE-SPEC.md"
area = "Steam link — command allowlist"
statement = "Permanently deny the Spa 'Steam Coach' function: it is mutually exclusive with steam and the shipped UI carries the interlock."
