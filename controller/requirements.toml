disputed = "The floor value is not in doubt. The stated consequence is: under saturn-protocol.md code 3 is parameter-out-of-range, under docs/devices/valve-control.md it is OVERTEMP_CONTROL. Which table applies is unresolved, so the meaning of the returned code is not stated as fact."

