area = "Steam link — protocol"
statement = "Byte-stuff 0x88, 0x55 and 0xAA with a leading 0xAA escape; never escape the SOF or EOF bytes themselves."
source = "docs/replacement-controller/HARDWARE-SPEC.md §12 protocol table"
tier = "C"
verification = "unit / property"
hard = false

[[requirement]]
id = "STEAM-03"
document = "docs/replacement-controller/HARDWARE-SPEC.md"
area = "Steam link — protocol"
statement = "Compute the DTV+ checksum as the 2's complement of DEST+SRC+CMD+payload, and verify a received frame by summing those fields plus the checksum to 0x00."
source = "docs/replacement-controller/HARDWARE-SPEC.md §12 protocol table"
tier = "C"
verification = "unit / property"
hard = false

[[requirement]]
id = "STEAM-04"
document = "docs/replacement-controller/HARDWARE-SPEC.md"
area = "Steam link — protocol"
statement = "Perform DTV+ discovery as DEV_ADDRESS_OPP 0x05 broadcast → DEV_REQUEST_ADDR 0x06 carrying the device ID → DEV_ASSIGN_ADDR 0x07."
source = "docs/replacement-controller/HARDWARE-SPEC.md §12 protocol table"
tier = "C"
verification = "emulator e2e"
hard = false

[[requirement]]
id = "STEAM-05"
document = "docs/replacement-controller/HARDWARE-SPEC.md"
area = "Steam link — protocol"
statement = "Address DTV+ devices as: ships at 0x00, master assigns 0x03–0x07, 0xFF is broadcast; the steam device ID is 0x05."
source = "docs/replacement-controller/HARDWARE-SPEC.md §12 protocol table"
tier = "C"
verification = "unit / emulator e2e"
hard = false

[[requirement]]
id = "STEAM-06"
document = "docs/replacement-controller/HARDWARE-SPEC.md"
area = "Steam link — protocol"
statement = "Implement only these DTV+ commands: GET_DEV_STATUS 0x30, STATUS_UPDATE 0x31, SET_DEV_PARAM 0x34, DEV_ACK 0x35, DEV_NAK 0x36, ERROR 0x37, CLEAR_FAULT_FLAGS 0x3A."
source = "docs/replacement-controller/HARDWARE-SPEC.md §12 protocol table"
tier = "C"
verification = "unit"
hard = false

[[requirement]]
id = "STEAM-07"
document = "docs/replacement-controller/HARDWARE-SPEC.md"
area = "Steam link — protocol"
statement = "Run the DTV+ link on a 150 ms tick with a 300 ms reply timeout, at 9600 8N1; do not implement the 150 ms DTV+ echo timeout (auto-direction converter, no local echo)."
source = "docs/replacement-controller/HARDWARE-SPEC.md §6 table and §12 protocol table"
tier = "C"
verification = "unit / emulator e2e"
hard = false
disputed = "STEAM-ADAPTER.md section 10.5 records STEAM_TICK_TIME 150 ms against dtv-plus-protocol.md's 500 ms port tick, unreconciled."

[[requirement]]
id = "STEAM-08"
document = "docs/replacement-controller/HARDWARE-SPEC.md"
area = "Steam link — encoding"
statement = "Encode steam temperatures as Fx2 (Fahrenheit × 2) and valve temperatures as Cx2 (Celsius × 2); make Cx2 and Fx2 distinct types that cannot be assigned to each other, and place the conversion Fx2 = ((Cx2 × 9) / 5) + 64 in exactly one place."
source = "docs/replacement-controller/HARDWARE-SPEC.md §12 'The encoding split is the one real implementation hazard'"
tier = "C"
verification = "unit (type-level: the cross-assignment must not compile) plus bench checks in §13"
hard = true

[[requirement]]
id = "STEAM-09"
document = "docs/replacement-controller/HARDWARE-SPEC.md"
area = "Steam link — limits"
statement = "Clamp the steam setpoint in our own code at both ends to 90 °F (32 °C) – 125 °F (52 °C) in 1 °F steps, before transmission, the same way valve setpoints are clamped."
source = "docs/replacement-controller/HARDWARE-SPEC.md §12 'Limits' table and following paragraph"
tier = "K"
verification = "unit / property (no frame leaves the encoder outside the range)"
hard = true

[[requirement]]
id = "STEAM-10"
document = "docs/replacement-controller/HARDWARE-SPEC.md"
area = "Steam link — limits"
statement = "Use 110 °F as the factory-default steam setpoint."
source = "docs/replacement-controller/HARDWARE-SPEC.md §12 'Limits' table"
tier = "K/A"
verification = "unit"
hard = false

[[requirement]]
id = "STEAM-11"
document = "docs/replacement-controller/HARDWARE-SPEC.md"
area = "Steam link — limits"
statement = "Clamp steam session duration to 1–20 minutes with a default of 10; the generator's own envelope is min run 10 min, max 20."
source = "docs/replacement-controller/HARDWARE-SPEC.md §12 'Limits' table"
tier = "K/B"
verification = "unit"
hard = true

[[requirement]]
id = "STEAM-12"
document = "docs/replacement-controller/HARDWARE-SPEC.md"
area = "Steam link — limits"
statement = "Treat steam_max_temp as installer configuration, not as a guarantee — it has no min/max in the shipped web UI — exactly as the water max_temp is treated; never derive a safety bound from it."
source = "docs/replacement-controller/HARDWARE-SPEC.md §12 (paragraph after the Limits table)"
tier = "B"
verification = "unit (clamp derives from the [K] range, not from configuration)"
hard = true

