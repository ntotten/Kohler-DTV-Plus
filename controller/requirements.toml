# Requirements register for the replacement controller.
#
# Machine-extracted from the documents named in each entry's `source`, then
# reviewed. It is DERIVED material: where an entry and its source document
# disagree, the document is right and the entry is the bug. Nothing here
# overrides docs/replacement-controller/, PROTOCOL.md or DISCLAIMER.md.
#
# Entries are keyed on (document, id), NOT on id alone. The ids collide badly
# across source documents: 88 of 348 distinct ids are used more than once, and
# SAFE-01 through SAFE-04 appear five times each with unrelated meanings, since
# each source document numbered its own requirements from one. Keying on id
# alone marks a requirement covered by a test for a different rule.
#
# That is not a hypothetical. The first draft of this file keyed the `disputed`
# flags on id alone and mis-marked two entries, one of which — "never transmit a
# steam timer duration of 0 minutes, because 0 disables the generator's
# automatic shutoff" — is a real safety rule with no dispute attached to it. The
# collision is recorded here because it will catch the next reader too.
#
# `verification` says how a requirement could be proven. Entries reading
# `not-testable-in-software` are the commissioning checklist: their absence from
# the test suite is accounted for rather than silent.
#
# `disputed` marks an entry that states a resolution to a question the source
# documents record as OPEN. Kept and marked rather than deleted, per AGENT.md
# rule 5. Do not implement to a disputed entry without reading its source.

[[requirement]]
id = "SAFE-01"
document = "docs/replacement-controller/CONTROLLER-DESIGN.md"
area = "safety/topology"
statement = "The K-99695 and the replacement controller must never be connected to the same valve bus."
source = "docs/replacement-controller/CONTROLLER-DESIGN.md § Safety boundary → Non-negotiable rules (1)"
verification = "not-testable-in-software (physical wiring); commissioning inspection"
hard = true

