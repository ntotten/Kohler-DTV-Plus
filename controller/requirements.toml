area = "protocol parameters"
statement = "Frames are at most 20 bytes: `AA 55` sync, addr, control, len, data, checksum."
source = "docs/replacement-controller/CONTROLLER-DESIGN.md § Software design → Protocol parameters"
tier = "C"
verification = "unit: encoder/decoder length bounds and fuzz for over-length rejection"
hard = true

[[requirement]]
id = "PROTO-04"
