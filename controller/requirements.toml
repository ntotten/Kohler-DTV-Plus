[[requirement]]
id = "STEAM-19"
document = "docs/replacement-controller/HARDWARE-SPEC.md"
area = "Steam link — link loss"
statement = "Make no assumption about the hard-loss case (USB gone, cable pulled, service dead, Pi unpowered): a dead process enforces no session limit, so steam falls entirely to the generator's own behaviour, which is not yet measured."
source = "docs/replacement-controller/HARDWARE-SPEC.md §12 'Losing the DTV+ link'"
verification = "not-testable-in-software; Phase 5 measurement"
hard = true

[[requirement]]
id = "STEAM-20"
document = "docs/replacement-controller/HARDWARE-SPEC.md"
area = "Steam link — link loss"
statement = "Enforce the service's own session limit for the degraded case, and assume the worst for the hard case until Phase 5 measures what the generator does when the DTV+ link drops mid-session."
source = "docs/replacement-controller/HARDWARE-SPEC.md §12 'Losing the DTV+ link' closing paragraphs"
verification = "unit (session timer) plus manual commissioning (Phase 5)"
hard = true

[[requirement]]
id = "STEAM-21"
document = "docs/replacement-controller/HARDWARE-SPEC.md"
area = "Steam link — hardware"
statement = "Give the steam link its own Waveshare SKU 23949 converter on a Pi USB 2.0 port with its own isolation barrier, and never join its field-side PE to either valve's."
source = "docs/replacement-controller/HARDWARE-SPEC.md §12 'Hardware' table"
verification = "not-testable-in-software; manual commissioning"
hard = true

[[requirement]]
id = "STEAM-22"
document = "docs/replacement-controller/HARDWARE-SPEC.md"
area = "Steam link — hardware"
statement = "Wire the adapter lead as four conductors: connector B/A/GND (pins 1/2/3) to the converter's TB/TA/PE, plus pin 4 to a +V rail supplied by our master; pin 3 GND is mandatory on this link, unlike the valve links."
source = "docs/replacement-controller/HARDWARE-SPEC.md §12 'Before the connector can be built' — pinout table and the Ground row"
tier = "A"
verification = "not-testable-in-software; manual commissioning"
hard = true

[[requirement]]
id = "STEAM-23"
document = "docs/replacement-controller/HARDWARE-SPEC.md"
area = "Steam link — hardware"
statement = "Leave our converter's termination jumper off on the steam link: the adapter is already terminated (114 Ω measured across pins 1 and 2, R27), and a second terminator halves the bus to 60 Ω (40 Ω with a chained second adapter), below the 54 Ω RS-485 drivers are specified against."
source = "docs/replacement-controller/HARDWARE-SPEC.md §12 'Before the connector can be built' — Termination row and 'Why our termination stays off'"
tier = "A"
verification = "not-testable-in-software; bench measurement"
hard = true

[[requirement]]
id = "STEAM-24"
document = "docs/replacement-controller/HARDWARE-SPEC.md"
area = "Steam link — hardware"
statement = "Add a 12 V rail to the enclosure to drive adapter pin 4, and confirm it before committing: apply 12 V to pin 4 from a current-limited supply with ground on pin 3 and measure IC2 pin 8 — about 5 V confirms the rail and the supply chain, and the current reading sizes the permanent supply."
source = "docs/replacement-controller/HARDWARE-SPEC.md §12 'New build requirement: a 12 V rail in the enclosure'"
tier = "I"
verification = "manual commissioning (bench measurement)"
hard = false

[[requirement]]
id = "STEAM-25"
document = "docs/replacement-controller/HARDWARE-SPEC.md"
area = "Steam link — scope"
statement = "Treat the generator and everything behind the adapter as out of scope; the generator owns its own safety envelope (low water/dry fire 0140-A, tank high-limit 0140-B, automatic fill shutoff, ¾″ pressure relief, room over-temperature 0120, session auto-shutoff) and this controller only sends setpoints."
source = "docs/replacement-controller/HARDWARE-SPEC.md §12 preamble and 'Out of scope'"
tier = "K"
verification = "not-testable-in-software"
hard = true

[[requirement]]
