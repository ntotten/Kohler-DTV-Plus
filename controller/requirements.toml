[[requirement]]
id = "STEAM-18"
document = "docs/replacement-controller/HARDWARE-SPEC.md"
area = "Steam link — link loss"
statement = "On a degraded-but-alive DTV+ link (timeouts, NAKs, checksum failures, port still open), command steam_stop, require acknowledgement, and latch the link unavailable."
