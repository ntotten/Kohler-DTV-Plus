tier = "C"
verification = "unit against golden fixtures; property test on corrupted bytes"
hard = true

[[requirement]]
id = "PROTO-05"
document = "docs/replacement-controller/CONTROLLER-DESIGN.md"
area = "protocol timing"
statement = "Poll at the 525 ms valve tick, wait 400 ms for a valve response, allow at most 320 ms for a complete message to arrive, use a 20 ms echo timeout, a 2000 ms enquiry rate between address-discovery attempts, a 2000 ms clear delay after address clear before re-discovery, and 3 retries for read, write, and address management alike."
source = "docs/replacement-controller/CONTROLLER-DESIGN.md § Software design → Protocol parameters table"
tier = "C"
verification = "unit on the timer constants; emulator e2e with delayed/partial responses"
hard = false
disputed = "Mixes the 400 ms response timeout with the 320 ms message timeout and a retry count the sources give as both 3 and 5. Both values are plumbed in code; neither is declared correct."

[[requirement]]
