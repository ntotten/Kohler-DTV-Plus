[[requirement]]
id = "USB-01"
document = "docs/replacement-controller/HARDWARE-SPEC.md"
area = "USB / serial startup"
statement = "At service start, set the FTDI latency_timer to 1 ms and set ASYNC_LOW_LATENCY on every RS-485 converter port, then read the value back and refuse to start if it does not read back 1 ms."
