document = "docs/replacement-controller/CONTROLLER-DESIGN.md"
area = "session limits"
statement = "Keep the 20-minute limit below the Prompt 3 valve's own 1800-second stop, and never send the timer refresh, so the valve's timer remains an independent hardware backstop; the refresh is only accepted once ≥ 900 s have elapsed."
