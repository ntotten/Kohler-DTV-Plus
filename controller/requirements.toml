area = "protocol/echo"
statement = "The decoder and emulator must not require a local echo, because a converter with automatic direction control does not present one; direction is inferred from address and content."
source = "docs/replacement-controller/CONTROLLER-DESIGN.md § Software design → Echo note"
verification = "unit: decode a capture with no echo frames present"
hard = true

