document = "app/src/api/model.ts Outlet.position/.statusIndex doc comments (lines 4-30), buildValve() lines 106-130, encodeOutlets() lines 289-295; DESIGN.md 'Outlet numbering is two index spaces'"
area = "outlet-mapping"
statement = "Model outlets using two independent index spaces plus a wire encoding, and never assume they coincide: (1) configuration slot 'position' (1-6, read from `one_type`..`six_type` for valve 1, or `v2_one_type`..`v2_six_type` for valve 2 — POS_KEYS = one,two,three,four,five,six mapped to 1..6) is the index the command endpoint (quick_shower.cgi) consumes and is used to build the valveN_outlet parameter string; (2) status/report index 'statusIndex' is the index system_info.cgi reports this outlet's state under as key `valveN` + 'outlet' + statusIndex (e.g. `valve1outlet3`), and this index comes from `valveN_outletM_func.id` in values.cgi (an object shaped `{func: <fitting type>, id: <system_info index>}`), NOT from the slot number M itself; (3) wire/command bitmap: to command a set of selected positions, sort the selected position numbers ascending and concatenate their digits into one string with no separators (e.g. positions {1,3,4} -> \"134\"); an empty set is NOT sent as an empty string to the state command — it is routed to the dedicated stop command instead (see CMD-02)."
source = "app/src/api/model.ts Outlet.position/.statusIndex doc comments (lines 4-30), buildValve() lines 106-130, encodeOutlets() lines 289-295; DESIGN.md 'Outlet numbering is two index spaces'"
