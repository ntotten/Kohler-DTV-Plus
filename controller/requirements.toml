[[requirement]]
id = "CLAMP-03"
document = "docs/replacement-controller/CONTROLLER-DESIGN.md"
area = "setpoint clamp"
statement = "The setpoint floor is `Cx2 = 60`, i.e. 30 °C / 86 °F (`MIN_SYS_VALVE_TEMP`); below it the valve returns error 3, parameter out of range."
