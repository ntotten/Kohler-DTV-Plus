area = "discovery"
statement = "Send the address allocation as AA 55 0F 3A 02 02 03 B0 to grant address 0x03 — i.e. DATA_LEN=0x02 with data [0x02 subcommand, new address]; do not copy the source's printed DATA_LEN of 0x01, which contradicts the two data bytes it then shows."
